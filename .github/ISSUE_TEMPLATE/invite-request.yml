name: Invitation request
description: Ask for a single-use invitation code so you can create an account at freedns.my
title: "[invite] "
labels: ["invitation"]
body:
  - type: markdown
    attributes:
      value: |
        Registration at **freedns.my** is by invitation only.

        This form is for the **account** only. Names are requested separately, with a pull request against
        `data/names.txt` - see https://freedns.my/names.php

        Fill this in and we will review it by hand. If it is approved, a **single-use code** is mailed to
        the address you give below, and we reply here to tell you to check that mailbox.

  - type: input
    id: email
    attributes:
      label: E-mail address to send the code to
      description: Exactly one address. Use the same address later for the console account.
      placeholder: name@example.com
    validations:
      required: true

  - type: input
    id: handle
    attributes:
      label: GitHub handle
      description: Filled in automatically if you are signed in - just confirm it is right.
      placeholder: KevinWhite-387
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: What do you want to use the registry for?
      description: One or two sentences. This is part of the review, so it cannot be left empty.
      placeholder: A personal blog, plus a couple of records pointing at my server.
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: Privacy and terms
      description: Both boxes are required - this is what the registry needs before it can create an account.
      options:
        - label: I have read and accept the terms of service (https://freedns.my/legal.php).
          required: true
        - label: I agree that the e-mail address above may be used to send the invitation code and essential account mail, as described in the privacy notice (https://freedns.my/legal.php?doc=privacy).
          required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I understand that the code works once, and that sharing it publicly will get it withdrawn.
          required: true
